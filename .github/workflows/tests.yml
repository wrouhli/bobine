# Vérifications automatiques — tests et syntaxe, à chaque PR et push sur main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Syntaxe des scripts Python
        run: python -m py_compile ingest.py enrichir.py generate_page.py graphe.py filtre.py
      - name: Syntaxe des scripts shell
        run: |
          bash -n install.sh
          bash -n desinstaller.sh
          bash -n watch.sh
          bash -n "👉 2. Installer Bobine.command"
      - name: Tests unitaires (édition Linux)
        run: python -m unittest discover -s linux/tests -v
      - name: Syntaxe (édition Linux)
        run: python -m py_compile linux/ingest.py linux/filtre.py linux/enrichir.py linux/generate_page.py linux/graphe.py linux/inbox_server.py linux/page_server.py
      - name: Syntaxe des scripts shell (édition Linux)
        run: |
          bash -n linux/install-linux.sh
          bash -n linux/desinstaller-linux.sh
          bash -n linux/watch-linux.sh
          bash -n linux/activer-page-web.sh
      - name: Le cœur partagé n'a pas dérivé
        run: |
          for f in ingest.py filtre.py enrichir.py generate_page.py graphe.py requirements.txt filtres.exemple.yaml LICENSE \
                   tests/test_ingest.py tests/test_enrichir.py tests/test_filtre.py; do
            cmp "$f" "linux/$f" || { echo "::error::$f a dérivé entre la racine et linux/ — garde-les identiques"; exit 1; }
          done
