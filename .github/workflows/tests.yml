# Vérifications automatiques — tests et syntaxe, à chaque PR et push sur main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Syntaxe des scripts Python
        run: python -m py_compile ingest.py enrichir.py generate_page.py graphe.py filtre.py
      - name: Syntaxe des scripts shell
        run: |
          bash -n install.sh
          bash -n desinstaller.sh
          bash -n watch.sh
          bash -n "👉 2. Installer Bobine.command"
